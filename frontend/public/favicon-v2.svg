<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient for Ticket -->
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2FF" />
      <stop offset="100%" stop-color="#7B00FF" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ticket Shadow/Glow Base -->
  <path d="M 128 96 H 384 A 32 32 0 0 1 416 128 V 224 A 32 32 0 0 0 416 288 V 384 A 32 32 0 0 1 384 416 H 128 A 32 32 0 0 1 96 384 V 288 A 32 32 0 0 0 96 224 V 128 A 32 32 0 0 1 128 96 Z" 
        fill="url(#ticketGrad)" filter="url(#glow)" opacity="0.4" />

  <!-- Main Ticket Shape -->
  <path d="M 128 96 H 384 A 32 32 0 0 1 416 128 V 224 A 32 32 0 0 0 416 288 V 384 A 32 32 0 0 1 384 416 H 128 A 32 32 0 0 1 96 384 V 288 A 32 32 0 0 0 96 224 V 128 A 32 32 0 0 1 128 96 Z" 
        fill="#121111" stroke="url(#ticketGrad)" stroke-width="12" />

  <!-- Ticket Perforations (Dotted internal lines) -->
  <line x1="140" y1="150" x2="372" y2="150" stroke="url(#ticketGrad)" stroke-width="4" stroke-dasharray="10 10" opacity="0.6" />
  <line x1="140" y1="362" x2="372" y2="362" stroke="url(#ticketGrad)" stroke-width="4" stroke-dasharray="10 10" opacity="0.6" />

  <!-- Stylized Letter 'A' (Absolute) -->
  <path d="M 256 165 L 335 325 H 295 L 256 245 L 217 325 H 177 Z" fill="url(#ticketGrad)" filter="url(#glow)" />
  
  <!-- Play Button Symbol in the Center -->
  <path d="M 242 255 L 282 275 L 242 295 Z" fill="#FFFFFF" />
</svg>
